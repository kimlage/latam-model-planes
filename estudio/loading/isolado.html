<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c002f"><title>LATAM · Loading</title><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;background:#0c002f;color:white;font-family:Arial,Helvetica,sans-serif}main{min-height:100svh;display:grid;place-items:center;padding-bottom:76px}latam-loading{width:100%;min-height:calc(100svh - 76px)}body.panel{background:#f3f1f7}body.panel latam-loading{width:min(460px,calc(100vw - 32px));min-height:0;border-radius:20px;box-shadow:0 24px 80px #0c002f25}.toolbar{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:#1d1033;border-top:1px solid #ffffff12;padding:14px 16px;z-index:2}.toolbar span{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#b0a1c4;margin-right:12px}button,a{border:1px solid #ffffff30;border-radius:20px;background:transparent;color:#f2ebff;font:12px Arial;padding:9px 14px;cursor:pointer;text-decoration:none}button:hover,a:hover{background:#ffffff12}button[aria-pressed=true]{background:#fff;color:#17052c}button:focus-visible,a:focus-visible{outline:3px solid #ff6490;outline-offset:3px}@media(max-width:520px){.toolbar{gap:6px;padding:10px}.toolbar span{display:none}button,a{padding:9px 11px;font-size:11px}main{padding-bottom:100px}latam-loading{min-height:calc(100svh - 100px)}}
</style><script type="module" src="./latam-loading.js"></script></head>
<body><main><latam-loading id="loading"></latam-loading></main>
<nav class="toolbar" aria-label="Controles da demonstração"><span>Prévia interativa</span><button id="layout" aria-pressed="false">Em um painel</button><button id="pause" aria-pressed="false">Pausar movimento</button><button id="simulate">Simular carregamento</button><a href="../?producao=latam-loading">Editar animação ↗</a></nav>
<script type="module">
const loading=document.querySelector('latam-loading');let timer;
document.querySelector('#layout').onclick=e=>{const compact=document.body.classList.toggle('panel');loading.setAttribute('size',compact?'compact':'full');e.target.setAttribute('aria-pressed',String(compact));e.target.textContent=compact?'Tela inteira':'Em um painel';};
document.querySelector('#pause').onclick=e=>{const paused=loading.toggleAttribute('paused');e.target.setAttribute('aria-pressed',String(paused));e.target.textContent=paused?'Retomar movimento':'Pausar movimento';};
function reset(){clearInterval(timer);loading.removeAttribute('progress');loading.removeAttribute('message');loading.setAttribute('state','loading');document.querySelector('#simulate').textContent='Simular carregamento';}
document.querySelector('#simulate').onclick=()=>{if(loading.hasAttribute('progress')||loading.getAttribute('state')==='ready'){reset();return;}let value=0;loading.setAttribute('progress','0');document.querySelector('#simulate').textContent='Reiniciar prévia';timer=setInterval(()=>{value+=5;loading.setAttribute('progress',String(value));loading.setAttribute('message',value<50?'Simulação · conectando sua próxima viagem':'Simulação · preparando os últimos detalhes');if(value>=100){clearInterval(timer);loading.removeAttribute('message');loading.setAttribute('state','ready');}},240);};
loading.addEventListener('retry',reset);
</script></body></html>
