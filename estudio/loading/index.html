<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LATAM · Cenas para loading</title><link rel="icon" href="data:,"><meta name="theme-color" content="#080a0f">
<style>*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f4f5f8;font:14px Arial,Helvetica,sans-serif}header{max-width:1440px;margin:auto;padding:26px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}.eyebrow{letter-spacing:.18em;font-size:10px;text-transform:uppercase;color:#b1b8cb}h1{font-size:23px;font-weight:400;letter-spacing:-.02em;margin:8px 0 0}header p{color:#9ca5ba;font-size:12px;max-width:350px;line-height:1.5;margin:0}.screen{max-width:1280px;margin:auto;border:1px solid #222737}latam-cinema{width:100%}.controls{max-width:1280px;margin:0 auto;padding:24px 0 32px;display:grid;grid-template-columns:1fr 1fr 1.5fr auto;gap:16px;align-items:end}label{display:grid;gap:9px;color:#aeb8ca;font-size:11px;letter-spacing:.03em}select,button,a{font:13px Arial;color:#f1f4fa;background:#141a26;border:1px solid #333b4c;border-radius:6px;padding:12px;text-decoration:none}select{width:100%}button,a{cursor:pointer}button:hover,a:hover{border-color:#8895af}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #ff3164;outline-offset:3px}.actions{display:flex;gap:8px}.details{max-width:1280px;margin:0 auto 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;color:#969fb3;font-size:12px}.details p{margin:0;line-height:1.6}.links{display:flex;gap:10px}.primary{background:#e91853;border-color:#e91853;color:white}body.full header,body.full .controls,body.full .details{display:none}body.full .screen{height:100svh;width:100vw;max-width:none;border:0;display:grid;place-items:center}body.full latam-cinema{width:min(100vw,177.7778svh)}#exit{display:none;position:fixed;right:20px;top:20px;z-index:4}body.full #exit{display:block}@media(max-width:1344px){.screen,.controls,.details{margin-left:24px;margin-right:24px}}@media(max-width:720px){header{padding:20px}header p{display:none}.screen{margin:0;border-left:0;border-right:0}.controls{grid-template-columns:1fr 1fr;margin:20px;padding:0;gap:14px}.controls label:nth-child(3){grid-column:1/-1}.actions{grid-column:1/-1}.details{margin:24px 20px;align-items:start;flex-direction:column}h1{font-size:20px}.links{flex-wrap:wrap}body.full .screen{margin:0}}</style></head>
<body><header><div><div class="eyebrow">LATAM · Motion library</div><h1>Loadings cinematográficos</h1></div><p>Cenas de aeroporto para acompanhar a espera.<br>Escolha o lugar, a aeronave e o momento.</p></header>
<main><div class="screen"><latam-cinema id="cinema"></latam-cinema></div>
<form class="controls" onsubmit="return false"><label>Aeroporto<select aria-label="Aeroporto" id="airport"></select></label><label>Aeronave<select aria-label="Aeronave" id="aircraft"></select></label><label>Situação<select aria-label="Situação" id="situation"></select></label><div class="actions"><button type="button" id="pause" aria-pressed="false">Pausar</button><button type="button" id="full">Ver como loading</button></div></form>
<div class="details"><p id="details" role="status"></p><div class="links"><button id="restart">Recomeçar cena</button><a id="edit" class="primary">Editar câmeras e exportar ↗</a><a href="README.md">Integração</a></div></div></main><button id="exit">Sair da prévia · Esc</button>
<script type="module" src="./preview.js"></script></body></html>
